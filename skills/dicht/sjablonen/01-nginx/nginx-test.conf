# Hulpbestand: test de sjablonen met nginx -t op een kopie, zonder de live configuratie te raken.
# Dekt: INFRA-47 (alleen de test, niet het herladen)
# Gebruik, vanuit een kopie van 01-nginx/ met de snippets op hun plek:
#   mkdir -p /tmp/nginx-proef/logs && nginx -t -p /tmp/nginx-proef -c "$PWD/nginx-test.conf"
#   De paden /etc/nginx/snippets/ en het certificaat in site-voorbeeld.conf moeten dan bestaan of in de
#   kopie zijn vervangen. Zonder certificaat: test alleen 00-dicht-http.conf en 01-default-server.conf.
# Nooit herladen vanuit dit bestand.

pid       logs/nginx.pid;
error_log logs/error.log;
events {}
http {
    access_log off;
    include conf.d/00-dicht-http.conf;
    include conf.d/01-default-server.conf;
    # include conf.d/site-voorbeeld.conf;
}
