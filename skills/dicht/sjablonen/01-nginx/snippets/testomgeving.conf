# Sjabloon: afscherming van een test-, staging- of demo-omgeving. Neem op in het server-blok.
# Dekt: WEB-72
# Aanpassen: het pad naar het wachtwoordbestand (maak het met htpasswd, modus 640, buiten de webroot en
#   buiten git). Een IP-allowlist kan in plaats van of naast basic auth (allow <adres>; deny all;).
# Niet gedekt: "geen kopie van echte klantdata" (WEB-72, DB-85) regel je in de data, niet hier.
# Let op: een location met alleen "return" slaat auth_basic over (return loopt voor de toegangscontrole;
#   gemeten: 200 zonder wachtwoord). Test de afscherming op een location die echt inhoud of proxy_pass heeft.
# Controleren: curl -sI https://<test-host>/ geeft 401 of 403 en toont X-Robots-Tag: noindex, nofollow.

auth_basic           "Testomgeving";
auth_basic_user_file /etc/nginx/htpasswd/<project>;
add_header X-Robots-Tag "noindex, nofollow" always;
