# Sjabloon: blokkade van dotfiles, back-ups, dumps, logs en editorbestanden. Neem op in elk server-blok.
# Dekt: WEB-64, WP-63 (alleen de blokkade op nginx; "weg" bewijs je op de server)
# Aanpassen:
#   - de lijst met extensies: .zip staat erin omdat WEB-64 hem noemt. Biedt de site bewust zip-bestanden
#     aan, maak dan een eigen location voor precies die map en leg dat vast.
#   - /.well-known/ blijft open voor ACME en security.txt (INFRA-65).
# Let op: dit vervangt het opruimen niet. Een bestand dat er niet hoort, haal je weg (WEB-64, WP-63).
# Let op: regex-locations gaan voor op prefix-locations; een location met ^~ omzeilt deze blokkade.
# Controleren (WEB-64):
#   for p in .git/config .env wp-config.php.bak backup.zip dump.sql wp-content/debug.log \
#            wp-content/ai1wm-backups/ phpinfo.php; do
#     curl -s -o /dev/null -w "%{http_code} $p\n" https://<host>/$p; done
#   geeft overal 403 of 404. phpinfo.php en debug.log dekt dit bestand alleen via de extensie .log;
#   phpinfo.php moet van de server af.

location ^~ /.well-known/ {
    allow all;
}

# Alles wat met een punt begint: .git, .env, .htaccess, .DS_Store, editorbestanden.
location ~ /\. {
    return 404;
}

# Back-ups, dumps, logs en editorresten.
location ~* \.(sql|sql\.gz|dump|bak|backup|old|orig|save|swp|swo|log|wpress|zip|tar|tar\.gz|tgz)$ {
    return 404;
}
location ~ ~$ {
    return 404;
}

# Back-upmappen van migratieplugins (WP-63).
location ~* ^/wp-content/(ai1wm-backups|plugins/all-in-one-wp-migration[^/]*/storage)/ {
    return 404;
}
