# Sjabloon: de vaste security headers, een plek voor alle servers en locations.
# Dekt: WEB-09 (alleen nosniff), WEB-11 (alleen object-src en base-uri), WEB-17, WEB-19, WEB-20, WEB-21 (alleen COOP),
#       WEB-23, WEB-24
# Dekt gedeeltelijk:
#   - WEB-11 en WEB-12: script-src met een nonce kan nginx niet leveren; de nonce maakt de applicatie per
#     respons (zie 08-api/csp-nonce.ts). Een browser past elk CSP-beleid toe dat hij krijgt, dus dit beleid
#     en het beleid van de applicatie gelden samen. Voor een statische site zonder applicatie: voeg hier een
#     script-src met hashes toe (WEB-12) en leg het vast.
#   - WEB-09: het juiste Content-Type met charset zet de applicatie of het mime-type van nginx, niet dit bestand.
#   - WEB-21: Cross-Origin-Resource-Policy hoort alleen op bronnen van een ingelogde gebruiker; zet die
#     in de location van die bronnen ("same-origin" of "same-site").
# Aanpassen:
#   - HSTS: zet includeSubDomains pas nadat elk subdomein uit DNS HTTPS serveert (WEB-17).
#   - frame-ancestors: 'none', of 'self' of een lijst als insluiten nodig is (WEB-24); pas X-Frame-Options mee aan.
#   - COOP: same-origin-allow-popups als een betaal- of OAuth-popup dat vereist (WEB-21).
#   - Permissions-Policy: microphone=(self) voor een app die de microfoon echt gebruikt (WEB-20).
#   - Referrer-Policy: de resetpagina en elke pagina met een geheim in pad of query krijgt no-referrer (WEB-19);
#     zet dat in de location of in de applicatie.
# Let op: zet de applicatie achter nginx dezelfde koppen (bijvoorbeeld via @fastify/helmet), dan staan ze
#   dubbel in de respons (gemeten met een upstream die ze ook zet). Zet elke kop op een plek.
# Controleren (WEB-23): 01-nginx/controleer-headers.sh <host> met vijf soorten URL's; elke respons heeft ze allemaal.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
