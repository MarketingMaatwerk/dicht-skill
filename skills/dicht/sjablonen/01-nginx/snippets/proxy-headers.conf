# Sjabloon: koppen naar de applicatie achter nginx. Neem op in elke location met proxy_pass.
# Dekt: WEB-51, WEB-22 (X-Powered-By), INV-50
# Aanpassen: voeg voor elke interne kop die de applicatie leest een regel toe die hem leegmaakt.
# In de applicatie: Fastify trustProxy op het adres van deze proxy, nooit blind true (WEB-51), en de
# applicatie luistert op 127.0.0.1 of een intern Docker-netwerk (INFRA-13).
# Controleren (WEB-51): twee aanvragen met een verschillende X-Forwarded-For geven in het applicatielog
# hetzelfde, echte clientadres.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;   # niet de waarde van de client doorgeven
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-User-Id         "";             # interne koppen leegmaken
proxy_set_header X-Tenant          "";
proxy_hide_header X-Powered-By;
