# Sjabloon: een site met een applicatie achter nginx (website of app met een API onder /api/).
# Dekt: WEB-56, INV-50, INFRA-46, WEB-66, ARCH-72, INFRA-45, API-18, WEB-51, INFRA-13
# Aanpassen: voorbeeld.nl (overal), het certificaatpad, de poort van de applicatie, de routes met een
#   limiet (elke route die mail stuurt, een account of bestelling maakt, inlogt, zoekt, exporteert of
#   meldingen ontvangt: WEB-66), de uploadroute en haar grootte.
# De private sleutel: modus 600, eigenaar root, buiten git en webroot (INFRA-54).
# Controleren:
#   nginx -t, daarna pas herladen, daarna een curl die het nieuwe gedrag toont (INFRA-47)
#   curl -sI http://voorbeeld.nl/ geeft 301 naar https op dezelfde host (WEB-56)
#   curl -si "https://voorbeeld.nl/%0d%0aX-Test:%201" toont geen kop X-Test (INV-50)
#   for i in $(seq 1 30); do curl -s -o /dev/null -w '%{http_code}\n' -X POST https://voorbeeld.nl/api/auth/login; done | sort | uniq -c
#       toont 429 (INFRA-46); alleen op een testomgeving
#   applicatie gestopt: curl -s https://voorbeeld.nl/ toont de eigen pagina, zonder servernaam of versie (ARCH-72)

upstream voorbeeld_app {
    server 127.0.0.1:3000;   # de applicatie luistert alleen op loopback (INFRA-13, WEB-51)
}

# Poort 80: alleen pagina's voor mensen doorsturen. Een API-host krijgt hier geen redirect maar een
# fout of een dichte poort (WEB-56). Vaste hostnaam en $request_uri, nooit $host of $uri (INV-50, WEB-42).
server {
    listen 80;
    listen [::]:80;
    server_name voorbeeld.nl www.voorbeeld.nl;

    location /api/ {
        return 403;
    }
    location / {
        return 301 https://voorbeeld.nl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name voorbeeld.nl;

    ssl_certificate     /etc/letsencrypt/live/voorbeeld.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voorbeeld.nl/privkey.pem;

    include /etc/nginx/snippets/blokkades.conf;

    # Eigen foutpagina als de applicatie niet antwoordt (ARCH-72).
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/foutpaginas;
        internal;
    }

    # Inloggen: limiet uit INFRA-46.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://voorbeeld_app;
    }

    # Formulier dat mail verstuurt: limiet uit WEB-66.
    location = /contact {
        limit_req zone=form burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://voorbeeld_app;
    }

    # Uploadroute: alleen hier een hogere grens, gelijk aan bodyLimit van de route (INFRA-45, API-18).
    # location = /api/uploads {
    #     client_max_body_size <kies, gelijk aan bodyLimit van de route>;
    #     include /etc/nginx/snippets/proxy-headers.conf;
    #     proxy_pass http://voorbeeld_app;
    # }

    # API: nginx onderschept de foutantwoorden van de applicatie niet; de client verwacht het
    # foutformaat van de applicatie zelf (ARCH-72, API-11).
    location /api/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://voorbeeld_app;
    }

    # HTML-routes.
    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://voorbeeld_app;
    }
}
