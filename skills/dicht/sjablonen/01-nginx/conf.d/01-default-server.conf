# Sjabloon: standaard-serverblokken die onbekende hostnamen weigeren.
# Dekt: INFRA-43
# Aanpassen: niets. Er mag maar een default_server per poort bestaan: verwijder die markering elders.
# Vereist: nginx 1.19.4 of hoger voor ssl_reject_handshake (versie uit de nginx-documentatie, geen regel).
# Controleren (INFRA-43, ook via IPv6):
#   echo | openssl s_client -connect <ip>:443 -servername bestaat-niet.invalid 2>&1 | grep -iE 'alert|subject='
#       toont een handshake-fout en geen certificaat
#   curl -s -o /dev/null -w '%{http_code}' -H 'Host: bestaat-niet.invalid' http://<ip>/
#       geeft 000

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
