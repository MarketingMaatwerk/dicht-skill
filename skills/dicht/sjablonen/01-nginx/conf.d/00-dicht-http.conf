# Sjabloon: instellingen voor het http-blok van nginx (wordt als conf.d-bestand ingelezen).
# Dekt: WEB-22, WEB-23, INFRA-44, INFRA-45, INFRA-46, INFRA-49, WEB-66, API-18
# Aanpassen:
#   - de zones onder "limieten per bron": de bron noemt alleen waarden voor inloggen (INFRA-46) en
#     formulieren (WEB-66). Voor webhooks, zoeken en algemeen noemt geen regel een waarde: kies ze
#     per project en leg ze vast in de documentatie (WEB-66, bewijs).
#   - het pad naar de snippets als de configuratie niet onder /etc/nginx staat.
# Vereist: nginx 1.29.3 of hoger voor add_header_inherit (WEB-23, INFRA-49). Op een oudere versie:
#   verwijder die regel en neem snippets/security-headers.conf op in elke location met een eigen add_header.
# Controleren:
#   nginx -t                                                      (INFRA-47, altijd voor een herlaadactie)
#   nginx -T | grep -E '^\s*ssl_(protocols|ciphers|prefer_server_ciphers)'      (INFRA-44)
#   nginx -T | grep -nE 'client_max_body_size|client_(header|body)_timeout|send_timeout'   (INFRA-45)
#   nginx -T | grep -n 'add_header_inherit'                       (INFRA-49)
# Niet gedekt: WEB-51 voor een proxy of CDN voor nginx (dan is $binary_remote_addr niet het echte clientadres).

# Versie verbergen (WEB-22). De standaard is "on".
server_tokens off;

# TLS volgens Mozilla intermediate, versie 6.0 (INFRA-44). Letterlijk uit de regel.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Limieten en time-outs voor aanvragen (INFRA-45, API-18). Verhoog client_max_body_size alleen
# in de location van een uploadroute en houd bodyLimit van de applicatie gelijk.
client_max_body_size 1m;
client_header_timeout 30s;
client_body_timeout 30s;
send_timeout 30s;

# Geen mapweergave (WEB-64). De standaard is "off"; hier expliciet zodat een include hem niet aanzet.
autoindex off;

# Limieten per bron (INFRA-46, WEB-66). Standaard antwoordt nginx met 503: zet 429.
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;   # INFRA-46
limit_req_zone $binary_remote_addr zone=form:10m rate=1r/s;    # WEB-66
# Kies zelf (geen waarde in de bron):
# limit_req_zone $binary_remote_addr zone=webhook:10m rate=<kies>;
# limit_req_zone $binary_remote_addr zone=zoek:10m rate=<kies>;
# limit_req_zone $binary_remote_addr zone=algemeen:10m rate=<kies>;

# Security headers op een plek, met overerving (WEB-23, INFRA-49).
add_header_inherit merge;
include /etc/nginx/snippets/security-headers.conf;
